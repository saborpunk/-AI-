debug: false
ai:
  base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
  connect-timeout: 2s
  read-timeout: 3s
spring:
  config:
    import: optional:file:./config/db.local.properties,optional:file:../config/db.local.properties,optional:file:./config/auth.local.properties,optional:file:../config/auth.local.properties
  application:
    name: seed-service
  datasource:
    url: jdbc:mysql://localhost:3306/seed_assistant?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=2000&socketTimeout=3000
    username: ${DB_USERNAME:seed_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 3000
      initialization-fail-timeout: -1
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-statement-timeout: 3
server:
  # 本地演示监听回环地址，公开部署须另行配置HTTPS。
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
