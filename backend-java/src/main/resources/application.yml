debug: false
ai:
  base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
  connect-timeout: 2s
  read-timeout: 3s
spring:
  application:
    name: seed-service
server:
  # 骨架只供本机验证；业务鉴权尚未实现。
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
